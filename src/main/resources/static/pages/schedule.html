<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111312">
    <meta name="description" content="COURTSIDE 남자 KBL 로컬 분석 워크스페이스 — 경기 일정">
    <title>경기 일정 — COURTSIDE</title>
    <link rel="icon" href="/assets/icons/court.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/components/matchups.css">
    <link rel="stylesheet" href="/css/pages/schedule.css">
    <script type="module" src="/js/pages/schedule.js"></script>
</head>
<body data-page="schedule">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <main id="main-content">

        <section class="page-heading" aria-labelledby="page-title">
            <div><div class="eyebrow"><span class="small-line"></span>GAME CENTER</div><h1 id="page-title">경기 일정</h1><p>날짜별 매치업과 결과, 경기의 맥락을 살펴보세요.</p></div>
            <button type="button" class="button button-secondary export-button" id="export-button"><svg class="icon"><use href="/assets/icons/sprite.svg#download"/></svg>리포트 내보내기</button>
        </section>
        <section class="schedule-panel" aria-labelledby="matchups-title">
            <div class="section-heading"><div class="heading-group"><h2 id="matchups-title">선택 날짜 매치업</h2><span class="count-pill" id="match-count"></span><span class="section-caption" id="match-date-caption"></span></div><div class="date-navigation"><button type="button" class="icon-button" id="previous-day" aria-label="이전 날짜"><svg class="icon"><use href="/assets/icons/sprite.svg#chevron-left"/></svg></button><span id="selected-date-label"></span><button type="button" class="icon-button" id="next-day" aria-label="다음 날짜"><svg class="icon"><use href="/assets/icons/sprite.svg#chevron-right"/></svg></button></div></div>
            <div class="day-tabs" id="day-tabs" role="group" aria-label="경기 날짜 선택"></div>
            <div class="match-cards" id="match-cards" role="group" aria-label="분석할 경기 선택"></div>
        </section>
        <section class="preview-grid" aria-label="선택 경기 분석">
            <article class="match-preview panel" id="featured-match"></article>
            <article class="insights-panel panel" aria-labelledby="insights-title">
                <div class="panel-heading"><h2 id="insights-title"><svg class="icon accent-text"><use href="/assets/icons/sprite.svg#spark"/></svg>승부를 가르는 숫자</h2><span class="micro-label">KEY FACTORS</span></div>
                <div id="match-insights"></div>
                <div class="insight-footnote"><svg class="icon"><use href="/assets/icons/sprite.svg#info"/></svg>분석 근거와 확률은 화면 확인용 예시입니다.</div>
            </article>
        </section>
    </main>
    <noscript><div class="noscript-message">화면을 보려면 브라우저에서 JavaScript를 활성화해주세요.</div></noscript>
</body>
</html>
