<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151311">
    <meta name="description" content="COURTSIDE 남자 KBL 로컬 분석 워크스페이스 — 경기 일정">
    <title>경기 일정 — COURTSIDE</title>
    <link rel="icon" href="/assets/icons/court.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/components/matchups.css">
    <link rel="stylesheet" href="/css/pages/schedule.css">
    <script type="module" src="/js/pages/schedule.js"></script>
</head>
<body data-page="schedule">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <main id="main-content">

        <section class="page-heading" aria-labelledby="page-title">
            <div><div class="eyebrow"><span class="small-line"></span>GAME CENTER</div><h1 id="page-title">경기 일정</h1><p>한국시간 기준 KBL 일정과 쿼터별 점수를 확인합니다.</p></div>
            <button type="button" class="button button-secondary export-button" id="export-button" disabled>
                <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#download"/></svg>일정 CSV 내보내기
            </button>
        </section>
        <section class="schedule-panel" aria-labelledby="matchups-title">
            <div class="section-heading">
                <div class="heading-group">
                    <h2 id="matchups-title">경기 목록</h2>
                    <span class="count-pill" id="match-count" hidden></span>
                    <span class="schedule-caption" id="match-date-caption"></span>
                </div>
                <div class="date-navigation">
                    <button type="button" class="icon-button" id="previous-day" aria-label="이전 날짜">
                        <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#chevron-left"/></svg>
                    </button>
                    <input type="date" id="schedule-date-input" aria-label="경기 날짜 직접 선택" min="1000-01-01" max="9999-12-31">
                    <button type="button" class="icon-button" id="next-day" aria-label="다음 날짜">
                        <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#chevron-right"/></svg>
                    </button>
                </div>
            </div>
            <div class="day-tabs" id="day-tabs" role="group" aria-label="경기 날짜 선택"></div>
            <div class="schedule-status panel" id="schedule-status">
                <p id="schedule-status-message" role="status">경기 일정을 불러오는 중입니다.</p>
                <button type="button" class="button button-secondary" id="retry-schedule" hidden>다시 조회</button>
            </div>
            <div class="match-cards" id="match-cards" role="group" aria-label="경기 선택" hidden></div>
            <article class="schedule-detail panel" id="featured-match" aria-labelledby="schedule-detail-title"
                    aria-live="polite" hidden></article>
        </section>
    </main>
    <noscript><div class="noscript-message">화면을 보려면 브라우저에서 JavaScript를 활성화해주세요.</div></noscript>
</body>
</html>
