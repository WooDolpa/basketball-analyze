<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151311">
    <meta name="description" content="COURTSIDE 남자 KBL 로컬 분석 워크스페이스 — 대시보드">
    <title>대시보드 — COURTSIDE</title>
    <link rel="icon" href="/assets/icons/court.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/components/metrics.css">
    <link rel="stylesheet" href="/css/components/matchups.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <script type="module" src="/js/pages/dashboard.js"></script>
</head>
<body data-page="dashboard">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <main id="main-content">

        <section class="page-heading" aria-labelledby="page-title">
            <div><div class="eyebrow"><span class="small-line"></span>KBL ANALYTICS</div><h1 id="page-title">오늘의 코트, <span>숫자로 읽다.</span></h1><p>핵심 지표와 주목 경기, 한눈에 보는 나의 농구 인사이트.</p></div>
            <button type="button" class="button button-secondary export-button" id="export-button"><svg class="icon"><use href="/assets/icons/sprite.svg#download"/></svg>예시 리포트 내보내기</button>
        </section>
        <section class="metrics-grid" id="summary-metrics" aria-label="예시 시즌 지표"></section>
        <section class="matchups-section" aria-labelledby="matchups-title">
            <div class="section-heading">
                <div>
                    <div class="heading-group"><h2 id="matchups-title">오늘 예정 경기</h2><span class="count-pill" id="match-count" hidden></span></div>
                    <p class="prediction-caption" id="match-date-caption" hidden></p>
                </div>
                <a class="text-button" id="schedule-link" href="/pages/schedule.html">예시 일정 보기 <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#arrow-right"/></svg></a>
            </div>
            <div class="prediction-status panel" id="prediction-status">
                <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#calendar"/></svg>
                <p id="prediction-status-message" role="status">오늘 예정 경기를 불러오는 중입니다.</p>
                <button class="button button-secondary" id="retry-predictions" type="button" hidden>다시 조회</button>
            </div>
            <div class="match-cards prediction-cards" id="match-cards" aria-label="예정 경기 선택" hidden></div>
            <div class="preview-grid prediction-details" id="prediction-details" aria-live="polite" hidden>
                <article class="panel prediction-panel" id="featured-match" aria-labelledby="featured-match-title"></article>
                <article class="panel prediction-panel" aria-labelledby="insights-title">
                    <h3 id="insights-title"><svg class="icon accent-text" aria-hidden="true"><use href="/assets/icons/sprite.svg#spark"/></svg>예측 근거</h3>
                    <div id="match-insights"></div>
                </article>
            </div>
        </section>
        <section class="overview-section" aria-labelledby="explore-title">
            <div class="section-heading"><h2 id="explore-title">분석을 이어가세요</h2><span class="micro-label">EXPLORE THE GAME</span></div>
            <div class="overview-links" id="overview-links"></div>
        </section>
    </main>
    <noscript><div class="noscript-message">화면을 보려면 브라우저에서 JavaScript를 활성화해주세요.</div></noscript>
</body>
</html>
