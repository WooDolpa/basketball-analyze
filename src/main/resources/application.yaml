spring:
  application:
    name: basketball-analyze
  datasource:
    url: jdbc:mariadb://${MARIADB_URL:}
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}
    hikari:
      minimum-idle: 5
      idle-timeout: 60000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: 9000
